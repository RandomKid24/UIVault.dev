<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>befui-web demo</title>
  <!-- From a CDN:  https://unpkg.com/befui-web/befui.css  and  https://unpkg.com/befui-web/befui.js -->
  <link rel="stylesheet" href="befui.css">
  <script src="befui.js" defer></script>
  <style>body{margin:0;padding:1.5rem 1rem 4rem;background:var(--background);color:var(--foreground);font:16px/1.5 var(--font-sans)}main{max-width:34rem;margin:auto}form>*+*{margin-top:1rem}.row{display:flex;gap:.5rem;flex-wrap:wrap}</style>
</head>
<body>
<main>
  <p class="row"><a href="docs.html">Docs →</a> <span class="bf-badge">befui-web</span> <span class="bf-badge bf-badge-success">no React</span></p>
  <div class="bf-card">
    <div class="bf-card-header"><h1 class="bf-card-title">Book a visit</h1><p class="bf-card-desc">Submit the form: the values appear in the address bar.</p></div>
    <form class="bf-card-body" method="get" action="index.html">
      <div><label class="bf-label" for="name">Name</label><input class="bf-input" id="name" name="name" placeholder="Ada Lovelace" required></div>
      <div><label class="bf-label" for="city">City</label>
        <bf-select id="city" name="city" placeholder="Choose a city" required style="width:100%">
          <option value="blr">Bengaluru</option><option value="del">Delhi</option><option value="mum">Mumbai</option><option value="pun" disabled>Pune (full)</option>
        </bf-select></div>
      <div><label class="bf-label" for="when">Date</label><bf-date-picker id="when" name="when" required style="width:100%"></bf-date-picker></div>
      <label class="row" style="align-items:center"><input class="bf-checkbox" type="checkbox" name="terms" value="yes" required> I agree to the terms</label>
      <div class="row"><button class="bf-btn">Book</button><button class="bf-btn bf-btn-outline" type="reset">Reset</button></div>
    </form>
  </div>
  <p class="row">
    <button class="bf-btn bf-btn-secondary" data-bf-open="#hello">Open dialog</button>
    <button class="bf-btn bf-btn-secondary" onclick="BefUI.toast('Saved your changes', {type:'success'})">Show toast</button>
  </p>
</main>

<bf-dialog id="hello" heading="Delete this visit?" description="This cannot be undone.">
  <p>A select works inside a dialog too:</p>
  <bf-select name="reason" value="x" style="width:100%"><option value="x">Plans changed</option><option value="y">Booked by mistake</option></bf-select>
  <button slot="footer" class="bf-btn bf-btn-outline" data-bf-close>Cancel</button>
  <button slot="footer" class="bf-btn bf-btn-destructive" data-bf-close onclick="BefUI.toast('Deleted', {type:'error'})">Delete</button>
</bf-dialog>
</body>
</html>
